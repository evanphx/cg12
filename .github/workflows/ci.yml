name: CI

on:
  push:
    branches: [main]
  pull_request:

# cg12 targets arm64: the goc corpus and the cg12-vs-gcc differential skip on
# any other architecture, so CI runs on GitHub's arm64 Linux runners where the
# whole suite actually executes. The test work is split across parallel jobs
# (and the runtime-capability matrix is further sharded) to keep wall-clock low.
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: gofmt
        # stdlib/ is vendored Go standard-library source (compiled by goc, kept
        # as upstream), so it is excluded from formatting checks.
        run: |
          unformatted=$(find . -name '*.go' -not -path './stdlib/*' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...

  test:
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fast Go unit tests: IR, optimizer, backends, analysis, ...
          - name: unit
            target: test-unit
            timeout: 15
          # The goc corpus: compile, link, and run real Go programs.
          - name: goc-corpus
            target: test-goc-corpus
            timeout: 25
          # The goc driver end-to-end tests (minus the capability matrix).
          - name: goc-cmd
            target: test-goc-cmd
            timeout: 20
          # cg12 C frontend vs gcc + miniruby regressions.
          - name: ruby-compiler
            target: test-ruby
            timeout: 25
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install C toolchain (cc/gcc for goc linking and the differential)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}
        timeout-minutes: ${{ matrix.timeout }}

  # The runtime-capability matrix (~322 Go programs compiled and executed),
  # sharded by capability index across parallel jobs.
  runtime-status:
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: runtime-status (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install C toolchain (cc for goc linking)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: make test-goc-status (shard ${{ matrix.shard }})
        run: make test-goc-status STATUS_SHARDS=4 STATUS_SHARD=${{ matrix.shard }}
        timeout-minutes: 20

  # The same matrix with goc optimization on, which is a distinct configuration:
  # the prebuilt runtime pack is built with -O as well, and both halves of the
  # split are optimized after the subtraction has run.
  #
  # It is here because it was not. `goc -O -runtime pack.gocrt` failed to link
  # sixteen capabilities for as long as the split has existed and no CI run
  # noticed, because every job validated the default arm only. It runs
  # alongside the default arm rather than replacing it: the two differ in what
  # they eliminate, so neither covers the other.
  runtime-status-opt:
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: runtime-status -O (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install C toolchain (cc for goc linking)
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: make test-goc-status-opt (shard ${{ matrix.shard }})
        run: make test-goc-status-opt STATUS_SHARDS=4 STATUS_SHARD=${{ matrix.shard }}
        timeout-minutes: 25
