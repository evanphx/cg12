name: Debug

# Temporary: diagnose why goc runtime-execution tests segfault on the arm64
# runner (they pass locally and in an ubuntu:24.04 container on other arm64
# hardware). Manual only. Remove once resolved.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y build-essential gdb
      - name: environment
        run: |
          echo "PAGESIZE=$(getconf PAGESIZE)"
          uname -a
          echo "core_pattern=$(cat /proc/sys/kernel/core_pattern)"
          lscpu 2>/dev/null | head -30 || head -30 /proc/cpuinfo
          cc --version | head -1
          ld --version | head -1
      - name: run the failing test (confirm the segfault)
        run: |
          set +e
          go test ./goc/ -run TestRuntimeDeferReturnValues -count=1 -v 2>&1 | tail -20
          echo "test exit: $?"
      - name: build a goc executable and backtrace its crash
        run: |
          set +e
          go build -o /tmp/goc ./cmd/goc
          printf 'package main\nfunc main() {}\n' > /tmp/p.go
          /tmp/goc -o /tmp/prog /tmp/p.go
          echo "goc build exit: $?"
          file /tmp/prog 2>/dev/null | head -1
          echo "--- run under gdb ---"
          gdb -batch -ex run -ex bt -ex 'info registers pc sp' /tmp/prog 2>&1 | tail -40
